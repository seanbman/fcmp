name: Grapher repository index

on:
  push:
    branches:
      - docs/grapher-index-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: ${{ !contains(github.event.head_commit.message || '', '[grapher-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical Grapher
        run: python -m pip install 'git+https://github.com/seanbman/grapher.git@main'

      - name: Build and verify semantic repository index
        run: python scripts/index_grapher.py

      - name: Commit published Grapher state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- .grapher/shared)" ]; then
            echo "Published Grapher state is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .grapher/shared
          git commit -m "grapher: publish repository index [grapher-generated]"
          git push
